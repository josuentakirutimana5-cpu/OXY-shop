<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Create Account | OXY & IVAN SHOP
</title>


<link rel="stylesheet" href="css/style.css">


</head>


<body>



<header>

<div class="logo">
OXY & IVAN SHOP
</div>


<a href="index.html">
Home
</a>


</header>





<section class="auth-box">


<h2>
Create Account
</h2>


<p>
Join Rwanda's online marketplace
</p>




<input 
id="name"
type="text"
placeholder="Full Name"
>



<input 
id="email"
type="email"
placeholder="Email Address"
>



<input 
id="password"
type="password"
placeholder="Password"
>




<select id="role">


<option value="buyer">
Buyer Account
</option>


<option value="seller">
Seller Account
</option>


</select>





<button onclick="register()">

Create Account

</button>



<p>

Already have an account?

<a href="login.html">
Login
</a>

</p>



</section>




<script src="js/auth.js"></script>


</body>

</html>
