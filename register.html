<!DOCTYPE html>

<html>

<head>

<title>
Register | OXY & IVAN SHOP
</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<section class="auth-box">


<h2>
Create Account
</h2>



<input 
id="regName"
placeholder="Full Name"
>



<input
id="regEmail"
placeholder="Email"
>



<input
id="regPassword"
type="password"
placeholder="Password"
>



<select id="regRole">


<option value="buyer">
Buyer
</option>


<option value="seller">
Seller
</option>


</select>




<button onclick="registerUser()">

Register

</button>



<p>

Already have account?

<a href="login.html">
Login
</a>

</p>



</section>




<script src="js/auth.js"></script>


</body>

</html>
